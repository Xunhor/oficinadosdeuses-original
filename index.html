<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada</title>
    <style>
        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color: #F1F1F1;
        }
        .conteiner{
            top: 100px;
            margin: auto;
            max-width: 500px;
            height: 500px;
        }
        .center{
            position: relative;
            top: 80px;
            margin: auto;
            width: 250px;
            height: 250px;
        }
        h1, p{
            text-align: center;
        }
        h1{
            font-size: 3em;
            
            text-shadow: red -2px 0, cyan 2px 0;
        }
        p{
            color: rgba(0, 0, 0, 0.5);
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="center">
            <h1>Erro 404</h1>
            <p>Página não encontrada.</p>
        </div>
    </div>
</body>
</html>
